[pytest]

log_file = ./log/test.log
log_file_level = info
log_file_format = [行号:%(lineno)d] %(asctime)s %(levelname)s %(filename)-15s [函数:%(funcName)-17s]-- %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

log_cli = True
log_cli_level = info
log_cli_format = [行号:%(lineno)d] %(asctime)s %(levelname)s %(filename)-15s [函数:%(funcName)-17s]-- %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S